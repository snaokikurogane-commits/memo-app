<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <style>
    :root{--ink:#162232;--muted:#687487;--line:#dce4ea;--paper:#fff;--wash:#f4f7f7;--brand:#146a6e;--brand-soft:#e5f2f1;--accent:#e08a38;--danger:#b3261e;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;color:var(--ink);background:var(--wash)}*{box-sizing:border-box}body{margin:0;background:var(--wash)}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{width:min(100%,900px);margin:0 auto;padding:22px 14px 104px}.top{display:flex;align-items:end;justify-content:space-between;padding:2px 4px 16px}.eyebrow{margin:0;color:var(--brand);font-size:11px;font-weight:800;letter-spacing:.11em}.top h1{margin:5px 0 0;font-size:27px;letter-spacing:-.04em}.sync{font-size:12px;color:var(--muted)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:13px;box-shadow:0 4px 16px rgba(20,45,55,.04)}.section-title{font-size:16px;margin:0 0 12px}.subtle{font-size:13px;color:var(--muted)}.search input,.field input,.field textarea,.field select,.filters input,.filters select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:0}.search input:focus,.field input:focus,.field textarea:focus,.field select:focus,.filters input:focus,.filters select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(20,106,110,.12)}.list{display:grid;gap:9px}.person-card{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:13px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:8px}.person-card:active{background:#f7fbfb}.person-name{font-weight:800;font-size:16px}.assignment{font-size:13px;margin-top:5px;line-height:1.45;color:#344354}.next{font-size:13px;color:var(--brand);margin-top:7px}.chev{color:var(--muted);font-size:22px;align-self:center}.empty{padding:25px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,900px);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(14px)}.nav button{border:0;background:transparent;border-radius:12px;padding:8px 2px;color:var(--muted);font-size:11px;font-weight:700}.nav button span{display:block;font-size:19px;margin-bottom:2px}.nav button.active{background:var(--brand-soft);color:var(--brand)}.view[hidden]{display:none}.primary,.secondary,.danger{border:0;border-radius:12px;padding:12px 15px;font-weight:800}.primary{background:var(--brand);color:#fff}.secondary{background:var(--brand-soft);color:#13575a}.danger{background:#fff0ee;color:var(--danger)}.primary:disabled{opacity:.55}.detail{position:fixed;z-index:50;inset:0;background:var(--wash);overflow:auto;padding-bottom:92px}.detail[hidden],.compose-sheet[hidden]{display:none}.detail-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(11px + env(safe-area-inset-top)) max(14px,calc((100% - 872px)/2)) 11px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.icon-btn{width:39px;height:39px;border:0;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:23px}.detail-body{width:min(100%,900px);margin:0 auto;padding:15px 14px}.identity h2{font-size:27px;margin:0}.identity p{margin:5px 0 0;color:var(--muted)}.timeline{display:grid;gap:12px}.timeline-item{border-left:3px solid #a4d4d2;padding:2px 0 2px 12px}.timeline-item strong{display:block}.conversation{border-left:3px solid var(--brand);background:#f8fbfb;padding:12px;border-radius:0 12px 12px 0;margin:9px 0}.conversation time{color:var(--brand);font-size:12px;font-weight:800}.conversation p{white-space:pre-wrap;line-height:1.55;margin:6px 0}.detail-actionbar{position:fixed;z-index:55;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,900px);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(16,35,45,.08)}.detail-actionbar .primary{width:100%}.compose-sheet{position:fixed;z-index:70;inset:0;background:var(--wash);overflow:auto}.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(11px + env(safe-area-inset-top)) max(14px,calc((100% - 872px)/2)) 11px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.sheet-head h2{margin:0;font-size:18px}.composer{width:min(100%,900px);margin:0 auto;padding:16px 14px calc(24px + env(safe-area-inset-bottom));background:var(--wash)}.composer-grid{display:grid;grid-template-columns:1fr;gap:9px}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:800;color:#536273}.field textarea{min-height:115px;resize:vertical}.tag-row{display:flex;gap:7px;overflow:auto;padding:2px 0 9px}.tag{flex:0 0 auto;border:1px solid #abd4d1;border-radius:999px;background:#fff;color:#176568;padding:6px 10px;font-size:12px}.tag.selected{background:var(--brand);color:#fff}.family-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.family-row:last-child{border:0}.family-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.family-form .wide{grid-column:1/-1}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters .wide{grid-column:1/-1}.roster-row{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.roster-row strong{font-size:16px}.roster-row div{margin-top:4px;font-size:13px;color:#425166}.pill{display:inline-block;border-radius:999px;background:var(--brand-soft);color:var(--brand);padding:4px 8px;font-size:12px;font-weight:800}.toast{position:fixed;z-index:100;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:calc(100% - 28px);padding:11px 15px;border-radius:12px;background:#162232;color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.16)}.toast.error{background:var(--danger)}.busy{opacity:.65;pointer-events:none}@media(min-width:700px){.composer-grid{grid-template-columns:1.2fr 1fr .75fr}.filters{grid-template-columns:repeat(4,1fr)}.filters .wide{grid-column:span 2}.family-form{grid-template-columns:repeat(3,1fr)}.compose-sheet{background:rgba(13,32,38,.35);padding:6vh 14px}.compose-sheet .composer{background:#fff;border-radius:20px;box-shadow:0 16px 40px rgba(0,0,0,.2)}.compose-sheet .sheet-head{width:min(100%,900px);margin:0 auto;border-radius:20px 20px 0 0}.compose-sheet .sheet-head+form{padding-top:12px}}
  </style>
</head>
<body>
  <main class="shell" id="app">
    <header class="top"><div><p class="eyebrow">PEOPLE NOTEBOOK</p><h1>人物ネタ帳</h1></div><div class="sync" id="sync">接続中…</div></header>
    <section class="view" id="view-home"><section class="panel"><div class="search"><input id="search" type="search" autocomplete="off" placeholder="名前・ふりがな・所属で検索"></div></section><section class="panel"><h2 class="section-title">人物 <span class="subtle" id="people-count"></span></h2><div class="list" id="people-list"></div><button class="secondary" id="load-more" hidden>さらに表示</button></section></section>
    <section class="view" id="view-follow" hidden><section class="panel"><h2 class="section-title">次に聞くこと</h2><p class="subtle">フォロー予定日を過ぎたメモです。</p><div class="list" id="follow-list"></div></section></section>
    <section class="view" id="view-recent" hidden><section class="panel"><h2 class="section-title">最近話した</h2><div class="list" id="recent-list"></div></section></section>
    <section class="view" id="view-roster" hidden><section class="panel"><h2 class="section-title">年度名簿</h2><div class="filters"><select id="roster-year"><option>令和8年度</option><option>令和7年度</option><option>令和6年度</option></select><input id="roster-query" class="wide" placeholder="氏名・所属・部門・役職で検索"><select id="roster-org"><option value="">全所属</option></select><select id="roster-department"><option value="">全部門</option></select><select id="roster-role"><option value="">全役職</option></select></div></section><section class="panel"><div class="subtle" id="roster-count"></div><div class="list" id="roster-list"></div></section></section>
  </main>
  <nav class="nav" id="nav"><button class="active" data-view="home"><span>⌕</span>人物検索</button><button data-view="follow"><span>✓</span>次に話す</button><button data-view="recent"><span>◷</span>最近</button><button data-view="roster"><span>▤</span>名簿</button></nav>
  <section class="detail" id="detail" hidden><header class="detail-head"><button class="icon-btn" id="detail-close" aria-label="閉じる">‹</button><strong id="detail-head-name">人物詳細</strong></header><div class="detail-body" id="detail-body"></div><div class="detail-actionbar"><button class="primary" id="compose-open" type="button">＋ 会話メモを追加</button></div><section class="compose-sheet" id="compose-sheet" hidden><header class="sheet-head"><h2>会話メモを追加</h2><button class="icon-btn" id="compose-close" type="button" aria-label="入力を閉じる">×</button></header><form class="composer" id="composer"><div class="tag-row" id="tag-row"></div><div class="composer-grid"><div class="field"><label for="memo">今日のメモ</label><textarea id="memo" maxlength="5000" placeholder="話したことを短く"></textarea></div><div class="field"><label for="next-topic">次に聞くこと</label><textarea id="next-topic" maxlength="1000" placeholder="次の会話の入口"></textarea></div><div class="field"><label for="follow-up">次回目安</label><input id="follow-up" type="date"><button class="primary" id="save-conversation" type="submit">保存して履歴に戻る</button></div></div></form></section></section>
  <div class="toast" id="toast" hidden></div><datalist id="person-options"></datalist>
  <script>
    'use strict';
    const state={bootstrap:null,people:[],person:null,limit:50,selectedTags:new Set(),roster:null};
    const tags=['同期','特に仲良し','ゴルフ','車','マラソン','LINE','雇用保険','給付経験あり'];
    function rpc(method,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error&&error.message||String(error))))[method](...args));}
    function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function clear(n){n.replaceChildren()}function dateText(v){if(!v)return'';const d=new Date(v);return isNaN(d)?String(v):new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'short',day:'numeric'}).format(d)}function toast(message,error=false){const n=document.getElementById('toast');n.textContent=message;n.classList.toggle('error',error);n.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.hidden=true,3200)}function busy(value){document.getElementById('app').classList.toggle('busy',value)}function assignmentText(a){return a?[a.organization,a.department,a.role].filter(Boolean).join(' / '):'所属未登録'}
    function makePersonCard(person,context){const b=el('button','person-card');b.type='button';const left=el('div');left.append(el('div','person-name',person.name));left.append(el('div','assignment',assignmentText(person.assignment)));if(context&&(context.next_topic||context.nextTopic))left.append(el('div','next','次に：'+(context.next_topic||context.nextTopic)));b.append(left,el('div','chev','›'));b.addEventListener('click',()=>openPerson(person.personId||person.person_id));return b}
    function renderPeople(){const list=document.getElementById('people-list');clear(list);const q=document.getElementById('search').value.normalize('NFKC').replace(/[\s\u3000]/g,'').toLowerCase();const rows=state.people.filter(p=>(p.name+p.kana+(p.aliases||[]).join(' ')+(p.tags||[]).join(' ')+assignmentText(p.assignment)).normalize('NFKC').replace(/[\s\u3000]/g,'').toLowerCase().includes(q));document.getElementById('people-count').textContent=rows.length+'人';rows.slice(0,state.limit).forEach(p=>list.append(makePersonCard(p,p.latestConversation)));if(!rows.length)list.append(el('div','empty','該当する人物がいません'));document.getElementById('load-more').hidden=rows.length<=state.limit}
    function renderCards(target,rows,empty){clear(target);rows.forEach(row=>{const p=state.people.find(x=>x.personId===row.person_id);if(p)target.append(makePersonCard(p,row))});if(!target.childNodes.length)target.append(el('div','empty',empty))}
    function renderBootstrap(data){state.bootstrap=data;state.people=data.people||[];document.getElementById('sync').textContent='更新 '+new Date(data.syncToken).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});renderPeople();renderCards(document.getElementById('follow-list'),data.followUps||[],'予定はありません');renderCards(document.getElementById('recent-list'),data.recent||[],'会話メモはまだありません')}
    async function loadBootstrap(){busy(true);try{const data=await rpc('getBootstrap',state.bootstrap&&state.bootstrap.syncToken||'');if(!data.unchanged)renderBootstrap(data)}catch(error){toast(error.message,true)}finally{busy(false)}}
    function renderTags(){const row=document.getElementById('tag-row');clear(row);tags.forEach(v=>{const b=el('button','tag'+(state.selectedTags.has(v)?' selected':''),v);b.type='button';b.addEventListener('click',()=>{state.selectedTags.has(v)?state.selectedTags.delete(v):state.selectedTags.add(v);renderTags()});row.append(b)})}
    function familyText(member){if(!member.current_age)return '年齢未登録';return (member.current_age.estimated?'推定 ':'')+member.current_age.value+'歳'}
    function renderDetail(data){const body=document.getElementById('detail-body');clear(body);const p=data.person;document.getElementById('detail-head-name').textContent=p.canonical_name;const identity=el('section','panel');identity.append(el('h2','',p.canonical_name),el('p','subtle',p.name_kana||'ふりがな未登録'));body.append(identity);const history=el('section','panel');history.append(el('h2','section-title','所属履歴'));const timeline=el('div','timeline');(data.assignments||[]).forEach(a=>{const item=el('div','timeline-item');item.append(el('strong','',a.fiscal_year+' · '+(a.organization||'所属未登録')),el('div','subtle',[a.department,a.role].filter(Boolean).join(' / ')||'役職未登録'));timeline.append(item)});if(!timeline.childNodes.length)timeline.append(el('div','empty','所属履歴がありません'));history.append(timeline);body.append(history);const conversations=el('section','panel');conversations.append(el('h2','section-title','会話履歴'));(data.conversations||[]).forEach(c=>{const card=el('article','conversation');card.append(el('time','',dateText(c.occurred_at)),el('p','',c.note||''));if(c.next_topic)card.append(el('div','next','次に：'+c.next_topic));conversations.append(card)});if(!(data.conversations||[]).length)conversations.append(el('div','empty','最初の会話メモを残しましょう'));body.append(conversations);const family=el('section','panel');family.append(el('h2','section-title','家族・子ども'));(data.familyMembers||[]).forEach(m=>{const row=el('div','family-row');row.append(el('strong','',m.display_name||'子ども'),el('span','pill',familyText(m)));family.append(row)});const form=el('div','family-form');const name=field('呼び名','family-name','text',''),birth=field('生年月日','family-birth','date',''),age=field('年齢（誕生日不明時）','family-age','number',''),observed=field('確認日','family-observed','date',new Date().toISOString().slice(0,10));const add=el('button','secondary','子ども情報を追加');add.type='button';add.className='secondary wide';add.addEventListener('click',async()=>{try{const saved=await rpc('saveFamilyMember',{personId:p.person_id,relationship:'child',displayName:name.input.value,birthDate:birth.input.value,observedAge:age.input.value,observedOn:observed.input.value});data.familyMembers.push(saved);renderDetail(data);toast('子ども情報を保存しました')}catch(error){toast(error.message,true)}});form.append(name.wrap,birth.wrap,age.wrap,observed.wrap,add);family.append(form);body.append(family)}
    function field(label,id,type,value){const wrap=el('div','field');const l=el('label','',label);l.htmlFor=id;const i=document.createElement('input');i.id=id;i.type=type;i.value=value||'';wrap.append(l,i);return{wrap:wrap,input:i}}
    function openComposer(){document.getElementById('compose-sheet').hidden=false;setTimeout(()=>document.getElementById('memo').focus(),0)}
    function closeComposer(clearInput){document.getElementById('compose-sheet').hidden=true;if(clearInput){document.getElementById('composer').reset();state.selectedTags.clear();renderTags()}}
    async function openPerson(id){document.getElementById('detail').hidden=false;document.body.style.overflow='hidden';closeComposer(false);document.getElementById('detail-body').replaceChildren(el('div','empty','読み込み中…'));try{state.person=await rpc('getPerson',id);renderDetail(state.person)}catch(error){toast(error.message,true);closeDetail()}}
    function closeDetail(){document.getElementById('detail').hidden=true;document.body.style.overflow='';closeComposer(true)}
    async function saveConversation(event){event.preventDefault();if(!state.person)return;const button=document.getElementById('save-conversation');button.disabled=true;button.textContent='保存中…';try{const input={personId:state.person.person.person_id,occurredAt:new Date().toISOString(),note:document.getElementById('memo').value,nextTopic:document.getElementById('next-topic').value,followUpAt:document.getElementById('follow-up').value,tags:[...state.selectedTags]};const saved=await rpc('saveConversation',input);state.person.conversations.unshift(Object.assign({},saved,{note:input.note,next_topic:input.nextTopic,follow_up_at:input.followUpAt,occurred_at:input.occurredAt}));closeComposer(true);renderDetail(state.person);toast('会話メモを保存しました');await loadBootstrap()}catch(error){toast(error.message,true)}finally{button.disabled=false;button.textContent='保存して履歴に戻る'}}
    function switchView(name){document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='view-'+name);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));if(name==='roster')loadRoster()}
    function fillSelect(select,values,label){const old=select.value;select.replaceChildren(new Option(label,''));values.forEach(v=>select.add(new Option(v,v)));select.value=old}
    async function loadRoster(){const year=document.getElementById('roster-year').value;const filters={query:document.getElementById('roster-query').value,organization:document.getElementById('roster-org').value,department:document.getElementById('roster-department').value,role:document.getElementById('roster-role').value};try{const result=await rpc('getRoster',year,filters);state.roster=result;fillSelect(document.getElementById('roster-org'),result.filters.organizations,'全所属');fillSelect(document.getElementById('roster-department'),result.filters.departments,'全部門');fillSelect(document.getElementById('roster-role'),result.filters.roles,'全役職');const list=document.getElementById('roster-list');clear(list);document.getElementById('roster-count').textContent=result.rows.length+'人';result.rows.forEach(r=>{const card=el('button','roster-row');card.type='button';card.append(el('strong','',r.name),el('div','',[r.organization,r.department,r.role].filter(Boolean).join(' / ')));card.addEventListener('click',()=>openPerson(r.person_id));list.append(card)});if(!result.rows.length)list.append(el('div','empty','該当者はいません'))}catch(error){toast(error.message,true)}}
    document.getElementById('search').addEventListener('input',()=>{state.limit=50;renderPeople()});document.getElementById('load-more').addEventListener('click',()=>{state.limit+=50;renderPeople()});document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(b)switchView(b.dataset.view)});document.getElementById('detail-close').addEventListener('click',closeDetail);document.getElementById('compose-open').addEventListener('click',openComposer);document.getElementById('compose-close').addEventListener('click',()=>closeComposer(false));document.getElementById('composer').addEventListener('submit',saveConversation);['roster-year','roster-query','roster-org','roster-department','roster-role'].forEach(id=>document.getElementById(id).addEventListener(id==='roster-query'?'input':'change',loadRoster));renderTags();loadBootstrap();
  </script>
</body>
</html>
