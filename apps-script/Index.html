<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <style>
    :root{--ink:#172033;--muted:#697386;--line:#dde3ec;--paper:#fff;--wash:#f3f6fa;--brand:#3057d5;--brand2:#6b46c1;--good:#137a4b;--warn:#a45712;--danger:#b42318;--shadow:0 12px 35px rgba(23,32,51,.09);font-family:Inter,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;color:var(--ink);background:var(--wash)}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#eef3ff 0,#f7f9fc 360px);min-height:100vh} button,input,textarea,select{font:inherit} button{cursor:pointer} .shell{width:min(100%,920px);margin:0 auto;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}
    .top{padding:26px 4px 18px;display:flex;justify-content:space-between;gap:16px;align-items:center}.eyebrow{margin:0;color:var(--brand);font-size:12px;font-weight:800;letter-spacing:.12em}.top h1{font-size:28px;margin:4px 0 0;letter-spacing:-.04em}.sync{font-size:12px;color:var(--muted);text-align:right}.panel{background:rgba(255,255,255,.94);border:1px solid rgba(220,227,238,.95);border-radius:24px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#233f9e,#7349bb);color:#fff;border:0}.hero .kicker{font-size:13px;opacity:.78}.hero h2{margin:8px 0 4px;font-size:22px}.hero p{margin:0;opacity:.86;line-height:1.6}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.section-title{font-size:17px;margin:0 0 12px}.subtle{color:var(--muted);font-size:13px}.search{position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:16px;padding:15px 16px 15px 46px;background:#fff;font-size:16px;outline:none}.search input:focus{border-color:#8ca1ea;box-shadow:0 0 0 4px rgba(48,87,213,.1)}.search:before{content:"⌕";position:absolute;left:17px;top:10px;font-size:24px;color:var(--muted)}
    .list{display:grid;gap:10px}.person-card{width:100%;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fff;padding:15px;display:grid;grid-template-columns:1fr auto;gap:8px;transition:.16s}.person-card:active{transform:scale(.985)}.person-name{font-weight:800;font-size:17px}.assignment{color:#4b5565;font-size:13px;margin-top:5px;line-height:1.45}.next-topic{color:var(--brand);font-size:13px;margin-top:7px}.chev{align-self:center;color:#8b95a7;font-size:22px}.empty{border:1px dashed #cdd5e2;border-radius:18px;padding:28px;text-align:center;color:var(--muted)}.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#edf1ff;color:#2949b8;font-size:12px;font-weight:700}.pill.warn{background:#fff1df;color:var(--warn)}
    .nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,920px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-top:1px solid rgba(214,221,232,.9)}.nav button{border:0;background:transparent;border-radius:13px;padding:8px 4px;color:#778195;font-size:11px;font-weight:700}.nav button span{display:block;font-size:20px;margin-bottom:2px}.nav button.active{background:#edf1ff;color:var(--brand)}.view[hidden]{display:none}.primary,.secondary,.danger{border:0;border-radius:13px;padding:11px 15px;font-weight:800}.primary{background:var(--brand);color:#fff}.secondary{background:#edf1f7;color:#364153}.danger{background:#fff0ee;color:var(--danger)}.primary:disabled{opacity:.5}.load-more{width:100%;margin-top:10px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:#586276;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px;outline:none}.field textarea{resize:vertical;min-height:92px;line-height:1.55}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8ca1ea;box-shadow:0 0 0 3px rgba(48,87,213,.1)}
    .detail{position:fixed;inset:0;z-index:50;background:var(--wash);overflow:auto;padding-bottom:260px}.detail[hidden]{display:none}.detail-head{position:sticky;top:0;z-index:4;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) max(16px,calc((100vw - 900px)/2)) 10px;display:flex;align-items:center;gap:12px}.icon-btn{border:0;background:#edf1f7;width:40px;height:40px;border-radius:50%;font-size:22px}.detail-body{width:min(100%,900px);margin:0 auto;padding:18px 16px}.identity h2{font-size:28px;margin:0}.identity p{margin:6px 0 0;color:var(--muted)}.timeline{display:grid;gap:0}.timeline-item{position:relative;padding:0 0 18px 28px}.timeline-item:before{content:"";position:absolute;left:7px;top:8px;width:9px;height:9px;background:var(--brand);border-radius:50%}.timeline-item:after{content:"";position:absolute;left:11px;top:20px;bottom:0;width:1px;background:#cfd7e6}.timeline-item:last-child:after{display:none}.timeline-item strong{display:block}.conversation{border-left:3px solid #9bb0f1;background:#fff;border-radius:0 14px 14px 0;padding:12px 14px;margin-bottom:10px}.conversation time{color:var(--good);font-size:12px;font-weight:800}.conversation p{margin:7px 0;white-space:pre-wrap;line-height:1.55}.conversation .next{color:var(--brand);font-size:13px}.composer{position:fixed;z-index:55;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,900px);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -14px 30px rgba(23,32,51,.09)}.composer textarea{min-height:58px}.composer-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tag-row{display:flex;gap:7px;overflow:auto;padding:3px 0 9px}.tag{white-space:nowrap;border:1px solid #a9b9ed;color:#2d4eb8;background:#fff;border-radius:999px;padding:6px 10px;font-size:12px}.tag.selected{background:#e8edff}.edit-box summary,.train summary{cursor:pointer;font-weight:800}.edit-box[open] summary,.train[open] summary{margin-bottom:14px}
    .import-drop{border:2px dashed #b7c4da;border-radius:18px;padding:24px;text-align:center;background:#fafcff}.import-summary{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.import-row{border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px;background:#fff}.import-row h3{font-size:16px;margin:0 0 5px}.import-row .source{font-size:12px;color:var(--muted)}.import-actions{display:grid;grid-template-columns:140px 1fr;gap:8px;margin-top:10px}.import-actions select,.import-actions input{min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px}.train{background:#18294f;color:#fff}.train select{background:#fff;color:#1f2937;border:0;border-radius:10px;padding:8px}.countdown{font-size:30px;font-weight:900;margin:12px 0 2px}.toast{position:fixed;z-index:100;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:calc(100% - 28px);background:#172033;color:#fff;padding:12px 16px;border-radius:13px;box-shadow:var(--shadow)}.toast.error{background:#9f1c17}.busy{opacity:.55;pointer-events:none}.skeleton{height:76px;border-radius:16px;background:linear-gradient(90deg,#eef1f5,#fafbfc,#eef1f5);background-size:200% 100%;animation:pulse 1.1s infinite}@keyframes pulse{to{background-position:-200% 0}}
    @media(min-width:700px){.home-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.home-grid .panel{margin:0}.composer-grid{grid-template-columns:1.3fr 1fr 1fr}.detail{padding-bottom:210px}}
  </style>
</head>
<body>
  <main class="shell" id="app">
    <header class="top"><div><p class="eyebrow">PEOPLE NOTEBOOK</p><h1>人物ネタ帳</h1></div><div class="sync" id="sync">接続中…</div></header>
    <section class="view" id="view-home">
      <div class="panel hero"><div class="kicker">会話を、次の会話へ</div><h2 id="hero-title">今日、誰と話しますか？</h2><p id="hero-copy">名前や所属から探し、30秒で次の話題を残せます。</p></div>
      <div class="panel"><div class="search"><input id="search" type="search" autocomplete="off" placeholder="名前・ふりがな・所属で検索"></div></div>
      <div class="home-grid">
        <section class="panel"><div class="row between"><h2 class="section-title">人物</h2><span class="subtle" id="people-count"></span></div><div class="list" id="people-list"><div class="skeleton"></div><div class="skeleton"></div></div><button class="secondary load-more" id="load-more" hidden>さらに表示</button></section>
        <section class="panel"><h2 class="section-title">次に話す</h2><div class="list" id="follow-list"></div></section>
      </div>
      <details class="panel train"><summary>🚃 電車カウントダウン（平日ダイヤ）</summary><div class="row between"><select id="route"><option value="toWork">山西 → 衣山方面</option><option value="toHome">衣山 → 山西方面</option></select><span class="subtle" id="train-note"></span></div><div class="countdown" id="countdown">--分--秒</div><div id="departure"></div></details>
    </section>
    <section class="view" id="view-follow" hidden><section class="panel"><h2 class="section-title">次に話す</h2><p class="subtle">フォロー日を過ぎた話題から順に表示します。</p><div class="list" id="follow-all"></div></section></section>
    <section class="view" id="view-recent" hidden><section class="panel"><h2 class="section-title">最近話した</h2><div class="list" id="recent-list"></div></section></section>
    <section class="view" id="view-import" hidden>
      <section class="panel"><h2 class="section-title">年度名簿の確認取込</h2><p class="subtle">OCR結果は人物マスタへ直接入りません。プレビューして、曖昧な行を確認してから確定します。</p><div class="import-drop"><input id="import-file" type="file" accept="application/json"><p class="subtle">extract_rosters.py が出力した import-staging.json</p><textarea id="import-json" rows="5" placeholder="または import-staging.json の内容をここへ貼り付け"></textarea><button class="secondary" id="load-import-json" type="button">貼り付けデータを読み込む</button></div><button class="primary" id="preview-import" disabled>照合プレビュー</button><div class="import-summary" id="import-summary"></div><div id="import-list"></div><button class="primary" id="commit-import" type="button" onclick="commitImport()" hidden>確認した内容で確定</button></section>
    </section>
  </main>
  <nav class="nav" id="nav"><button class="active" data-view="home"><span>⌕</span>人物検索</button><button data-view="follow"><span>✓</span>次に話す</button><button data-view="recent"><span>◷</span>最近</button><button data-view="import"><span>⇧</span>名簿取込</button></nav>
  <section class="detail" id="detail" hidden><header class="detail-head"><button class="icon-btn" id="detail-close" aria-label="閉じる">‹</button><strong id="detail-head-name">人物詳細</strong></header><div class="detail-body" id="detail-body"></div><form class="composer" id="composer"><div class="tag-row" id="tag-row"></div><div class="composer-grid"><div class="field"><label for="memo">今日のメモ</label><textarea id="memo" maxlength="5000" placeholder="話したことを短く"></textarea></div><div class="field"><label for="next-topic">次に聞くこと</label><textarea id="next-topic" maxlength="1000" placeholder="次の会話の入口"></textarea></div><div><div class="field"><label for="follow-up">次回目安</label><input id="follow-up" type="date"></div><button class="primary" id="save-conversation" type="submit">保存</button></div></div></form></section>
  <div class="toast" id="toast" hidden></div>
  <datalist id="person-options"></datalist>
  <script>
    'use strict';
    const state={bootstrap:null,people:[],person:null,limit:40,importPayload:null,importPreview:null,selectedTags:new Set()};
    const tags=['同期','特に仲良し','ゴルフ','車','マラソン','LINEメンバー','雇用保険','給付経験あり','結婚済み','子供いる','酒飲めない'];
    const schedules={toWork:{6:[23,55],7:[18,44],8:[7,21,35,48],9:[6,21,36,51],10:[6,21,36,51],11:[6,21,36,51],12:[6,21,36,51],13:[6,21,36,51],14:[6,21,36,51],15:[6,21,36,51],16:[6,21,36,51],17:[6,21,36,51],18:[6,21,36,51],19:[6,21,36,51],20:[6,21,36,51],21:[11,31,51],22:[11,31,51],23:[11]},toHome:{6:[47],7:[2,17,30,42,52],8:[6,19,28,52],9:[7,22,37,52],10:[7,22,37,52],11:[7,22,37,52],12:[7,22,37,52],13:[7,22,37,52],14:[7,22,37,52],15:[7,22,37,52],16:[7,22,37,52],17:[7,22,37,52],18:[7,22,37,52],19:[7,22,37,52],20:[7,22,37],21:[7,37],22:[7,37],23:[7,30]}};
    const mockPeople=[{personId:'per_demo1',name:'山田太郎',kana:'やまだたろう',aliases:[],tags:['旅行'],active:'active',assignment:{fiscal_year:'令和8年度',organization:'松山公共職業安定所',department:'職業相談部門',role:'職業紹介係'},latestConversation:{occurred_at:'2026-08-10',note:'夏休みの旅行について話した',next_topic:'旅行先はどうだったか',follow_up_at:'2026-08-18'}},{personId:'per_demo2',name:'佐藤花子',kana:'さとうはなこ',aliases:[],tags:[],active:'active',assignment:{fiscal_year:'令和8年度',organization:'愛媛労働局',department:'総務部',role:'総務係'},latestConversation:null},{personId:'per_demo3',name:'鈴木一郎',kana:'すずきいちろう',aliases:['鈴木 一郎'],tags:['マラソン'],active:'active',assignment:{fiscal_year:'令和8年度',organization:'新居浜公共職業安定所',department:'',role:'上席職業指導官'},latestConversation:{occurred_at:'2026-08-12',note:'最近ランニングを再開',next_topic:'次の大会は決めたか',follow_up_at:'2026-08-16'}}];
    const mock={getBootstrap:()=>({schemaVersion:2,syncToken:new Date().toISOString(),currentFiscalYear:'令和8年度',people:mockPeople,followUps:mockPeople.filter(p=>p.latestConversation).map(p=>Object.assign({person_id:p.personId},p.latestConversation)),recent:mockPeople.filter(p=>p.latestConversation).map(p=>Object.assign({person_id:p.personId},p.latestConversation))}),getPerson:id=>{const p=mockPeople.find(x=>x.personId===id);return{person:{person_id:p.personId,canonical_name:p.name,name_kana:p.kana,aliases_json:JSON.stringify(p.aliases),profile_tags_json:JSON.stringify(p.tags),revision:1,active_status:'active'},assignments:[p.assignment],conversations:p.latestConversation?[Object.assign({conversation_id:'demo',person_id:id},p.latestConversation)]:[],events:[]}},saveConversation:data=>Object.assign({conversation_id:'local_'+Date.now(),person_id:data.personId,created_at:new Date().toISOString()},data),updatePerson:data=>Object.assign({},data,{canonical_name:data.name,name_kana:data.kana,revision:Number(data.revision)+1}),previewRosterImport:payload=>({batchId:'local_batch',summary:{total:payload.rows.length,exact_unique:0,ambiguous:0,new_candidate:payload.rows.length},rows:payload.rows.map((r,i)=>Object.assign({},r,{import_row_id:r.import_row_id||'local_'+i,match_type:'new_candidate',candidate_person_id:'',review_status:'pending'}))}),commitRosterImport:data=>({ok:true,batchId:data.batchId,peopleCreated:data.resolutions.filter(x=>x.action==='create').length,assignmentsCreated:data.resolutions.filter(x=>x.action!=='skip').length,skipped:data.resolutions.filter(x=>x.action==='skip').length})};
    function rpc(method,...args){if(window.google&&google.script&&google.script.run)return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error&&error.message||String(error))))[method](...args));return Promise.resolve(mock[method](...args));}
    function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}function clear(node){while(node.firstChild)node.removeChild(node.firstChild)}function dateText(v){if(!v)return'';const d=new Date(v);return isNaN(d)?String(v):new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'short',day:'numeric'}).format(d)}
    function toast(message,error=false){const box=document.getElementById('toast');box.textContent=message;box.classList.toggle('error',error);box.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>box.hidden=true,3200)}function setBusy(value){document.getElementById('app').classList.toggle('busy',value)}
    function personById(id){return state.people.find(person=>person.personId===String(id))}function assignmentText(a){return a?[a.organization,a.department,a.role].filter(Boolean).join(' / '):'現所属なし'}
    function makePersonCard(person,context){const button=el('button','person-card');button.type='button';const main=el('div');main.append(el('div','person-name',person.name));main.append(el('div','assignment',assignmentText(person.assignment)));if(context){const next=context.next_topic||context.nextTopic;if(next)main.append(el('div','next-topic','次に：'+next));const stamp=context.follow_up_at||context.occurred_at;if(stamp)main.append(el('div','subtle',dateText(stamp)))}button.append(main,el('div','chev','›'));button.addEventListener('click',()=>openPerson(person.personId));return button}
    function renderPeople(){const list=document.getElementById('people-list');clear(list);const query=document.getElementById('search').value.normalize('NFKC').replace(/[\s\u3000]/g,'').toLowerCase();const filtered=state.people.filter(p=>(p.name+p.kana+(p.aliases||[]).join(' ')+(p.tags||[]).join(' ')+assignmentText(p.assignment)).normalize('NFKC').replace(/[\s\u3000]/g,'').toLowerCase().includes(query));document.getElementById('people-count').textContent=filtered.length+'人';filtered.slice(0,state.limit).forEach(p=>list.append(makePersonCard(p,p.latestConversation)));if(!filtered.length)list.append(el('div','empty','該当する人物がいません'));document.getElementById('load-more').hidden=filtered.length<=state.limit}
    function renderConversationList(target,rows,emptyText){clear(target);rows.forEach(row=>{const person=personById(row.person_id);if(person)target.append(makePersonCard(person,row))});if(!target.childNodes.length)target.append(el('div','empty',emptyText))}
    function renderBootstrap(data){state.bootstrap=data;state.people=data.people||[];document.getElementById('sync').textContent='更新 '+new Date(data.syncToken).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});renderPeople();renderConversationList(document.getElementById('follow-list'),(data.followUps||[]).slice(0,5),'予定された話題はありません');renderConversationList(document.getElementById('follow-all'),data.followUps||[],'予定された話題はありません');renderConversationList(document.getElementById('recent-list'),data.recent||[],'会話メモはまだありません');const options=document.getElementById('person-options');clear(options);state.people.forEach(p=>{const o=document.createElement('option');o.value=p.name+' — '+p.personId;options.append(o)})}
    async function loadBootstrap(){setBusy(true);try{const data=await rpc('getBootstrap',state.bootstrap&&state.bootstrap.syncToken||'');if(data.unchanged){document.getElementById('sync').textContent='最新 '+new Date(data.syncToken).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}else renderBootstrap(data)}catch(error){toast(error.message,true);document.getElementById('sync').textContent='接続エラー'}finally{setBusy(false)}}
    function renderDetail(data){const body=document.getElementById('detail-body');clear(body);const person=data.person;document.getElementById('detail-head-name').textContent=person.canonical_name;const identity=el('section','panel identity');identity.append(el('h2','',person.canonical_name),el('p','',person.name_kana||'ふりがな未登録'));const personTags=JSON.parse(person.profile_tags_json||'[]');if(personTags.length){const tagBox=el('div','tag-row');personTags.forEach(value=>tagBox.append(el('span','pill',value)));identity.append(tagBox)}const edit=document.createElement('details');edit.className='edit-box';edit.append(el('summary','','マスタ情報を編集'));const nameField=field('氏名','edit-name','text',person.canonical_name),kanaField=field('ふりがな','edit-kana','text',person.name_kana||''),aliasField=field('旧字体・別名（1行1件）','edit-aliases','textarea',(JSON.parse(person.aliases_json||'[]')).join('\n')),profileTagField=field('検索タグ（1行1件）','edit-profile-tags','textarea',personTags.join('\n'));const save=el('button','secondary','マスタ情報を保存');save.type='button';save.addEventListener('click',async()=>{try{setBusy(true);const updated=await rpc('updatePerson',{personId:person.person_id,revision:person.revision,name:nameField.input.value,kana:kanaField.input.value,aliases:aliasField.input.value.split('\n').map(x=>x.trim()).filter(Boolean),profileTags:profileTagField.input.value.split('\n').map(x=>x.trim()).filter(Boolean),activeStatus:person.active_status||'active'});person.revision=updated.revision;person.canonical_name=updated.canonical_name;person.name_kana=updated.name_kana;person.profile_tags_json=updated.profile_tags_json;toast('人物情報を更新しました');await loadBootstrap()}catch(error){toast(error.message,true)}finally{setBusy(false)}});edit.append(nameField.wrap,kanaField.wrap,aliasField.wrap,profileTagField.wrap,save);identity.append(edit);body.append(identity);const aPanel=el('section','panel');aPanel.append(el('h2','section-title','所属履歴'));const timeline=el('div','timeline');(data.assignments||[]).forEach(a=>{const item=el('div','timeline-item');item.append(el('strong','',a.fiscal_year+' · '+(a.organization||'所属未登録')),el('div','subtle',[a.department,a.role].filter(Boolean).join(' / ')||'役職未登録'));timeline.append(item)});if(!timeline.childNodes.length)timeline.append(el('div','empty','所属履歴がありません'));aPanel.append(timeline);body.append(aPanel);const cPanel=el('section','panel');cPanel.append(el('h2','section-title','会話履歴'));(data.conversations||[]).forEach(c=>{const card=el('article','conversation');card.append(el('time','',dateText(c.occurred_at)),el('p','',c.note||''));if(c.next_topic)card.append(el('div','next','次に：'+c.next_topic));cPanel.append(card)});if(!(data.conversations||[]).length)cPanel.append(el('div','empty','最初の会話メモを残してみましょう'));body.append(cPanel)}
    function field(labelText,id,type,value){const wrap=el('div','field');const label=el('label','',labelText);label.htmlFor=id;let input=type==='textarea'?document.createElement('textarea'):document.createElement('input');input.id=id;if(type!=='textarea')input.type=type;input.value=value||'';wrap.append(label,input);return{wrap,input}}
    async function openPerson(id){document.getElementById('detail').hidden=false;document.body.style.overflow='hidden';document.getElementById('detail-body').replaceChildren(el('div','skeleton'));try{state.person=await rpc('getPerson',id);renderDetail(state.person);document.getElementById('memo').focus()}catch(error){toast(error.message,true);closeDetail()}}
    function closeDetail(){document.getElementById('detail').hidden=true;document.body.style.overflow='';state.person=null;document.getElementById('composer').reset();state.selectedTags.clear();renderTags()}
    function renderTags(){const row=document.getElementById('tag-row');clear(row);tags.forEach(value=>{const button=el('button','tag'+(state.selectedTags.has(value)?' selected':''),value);button.type='button';button.addEventListener('click',()=>{state.selectedTags.has(value)?state.selectedTags.delete(value):state.selectedTags.add(value);renderTags()});row.append(button)})}
    async function saveConversation(event){event.preventDefault();if(!state.person)return;const button=document.getElementById('save-conversation');button.disabled=true;try{const input={personId:state.person.person.person_id,occurredAt:new Date().toISOString(),note:document.getElementById('memo').value,nextTopic:document.getElementById('next-topic').value,followUpAt:document.getElementById('follow-up').value,tags:Array.from(state.selectedTags)};const saved=await rpc('saveConversation',input);state.person.conversations.unshift(Object.assign({note:input.note,next_topic:input.nextTopic,follow_up_at:input.followUpAt,occurred_at:input.occurredAt},saved));renderDetail(state.person);document.getElementById('composer').reset();state.selectedTags.clear();renderTags();toast('会話メモを保存しました');await loadBootstrap()}catch(error){toast(error.message,true)}finally{button.disabled=false}}
    function switchView(name){document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='view-'+name);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));window.scrollTo({top:0,behavior:'smooth'})}
    async function previewImport(){if(!state.importPayload)return;setBusy(true);try{state.importPreview=await rpc('previewRosterImport',state.importPayload);renderImportPreview();toast('照合プレビューを作成しました')}catch(error){toast(error.message,true)}finally{setBusy(false)}}
    function renderImportPreview(){const preview=state.importPreview,summary=document.getElementById('import-summary'),list=document.getElementById('import-list');clear(summary);clear(list);[['合計',preview.summary.total],['一致',preview.summary.exact_unique],['曖昧',Number(preview.summary.ambiguous||0)+Number(preview.summary.ambiguous_same_name||0)],['新規候補',preview.summary.new_candidate]].forEach(([label,count])=>summary.append(el('span','pill'+(label==='曖昧'?' warn':''),label+' '+count)));preview.rows.forEach(row=>{const card=el('div','import-row');card.dataset.rowId=row.import_row_id;card.append(el('h3','',row.printed_name),el('div','source',[row.fiscal_year,row.organization,row.department,row.role].filter(Boolean).join(' / ')));if(row.match_type==='ambiguous_same_name')card.append(el('div','pill warn','同一年度に同名あり'));const actions=el('div','import-actions');const action=document.createElement('select');[['','選択してください'],['link','既存人物に紐付け'],['create','新規人物として追加'],['defer','確認待ちのまま保留'],['skip','今回は除外']].forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;action.append(option)});action.value=row.match_type==='exact_unique'?'link':row.match_type==='new_candidate'?'create':'defer';const person=document.createElement('input');person.setAttribute('list','person-options');person.placeholder='既存人物を検索';if(row.candidate_person_id){const found=personById(row.candidate_person_id);person.value=found?found.name+' — '+found.personId:row.candidate_person_id}person.hidden=action.value!=='link';action.addEventListener('change',()=>person.hidden=action.value!=='link');actions.append(action,person);card.append(actions);list.append(card)});document.getElementById('commit-import').hidden=false}
    function personIdFromChoice(value){const match=String(value||'').match(/—\s*(per_[a-zA-Z0-9]+)$/);return match?match[1]:String(value||'').trim()}
    async function commitImport(){const rows=Array.from(document.querySelectorAll('.import-row'));const resolutions=rows.map(card=>{const select=card.querySelector('select'),input=card.querySelector('input');return{importRowId:card.dataset.rowId,action:select.value,personId:select.value==='link'?personIdFromChoice(input.value):''}});if(resolutions.some(r=>!r.action)){toast('未選択の行があります',true);return}setBusy(true);try{const result=await rpc('commitRosterImport',{batchId:state.importPreview.batchId,resolutions});toast('確定しました：所属 '+result.assignmentsCreated+'件');state.importPreview=null;clear(document.getElementById('import-list'));document.getElementById('commit-import').hidden=true;await loadBootstrap()}catch(error){toast(error.message,true)}finally{setBusy(false)}}
    function tickTrain(){const now=new Date(),route=document.getElementById('route').value,schedule=schedules[route];let next=null;for(let offset=0;offset<2&&!next;offset++){const day=new Date(now);day.setDate(now.getDate()+offset);Object.keys(schedule).map(Number).sort((a,b)=>a-b).some(hour=>schedule[hour].some(minute=>{const candidate=new Date(day);candidate.setHours(hour,minute,0,0);if(candidate>now){next=candidate;return true}return false}))}if(!next)return;const diff=Math.max(0,Math.floor((next-now)/1000));document.getElementById('countdown').textContent=Math.floor(diff/60)+'分'+String(diff%60).padStart(2,'0')+'秒';document.getElementById('departure').textContent='次発 '+next.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});document.getElementById('train-note').textContent=[0,6].includes(now.getDay())?'平日ダイヤ参考':''}
    function loadImportPayload(text){try{const parsed=JSON.parse(text);if(!Array.isArray(parsed.rows))throw new Error('rows配列がありません');state.importPayload=parsed;document.getElementById('preview-import').disabled=false;toast(parsed.rows.length+'行を読み込みました')}catch(error){state.importPayload=null;document.getElementById('preview-import').disabled=true;toast('JSONを読めません：'+error.message,true)}}
    document.getElementById('search').addEventListener('input',()=>{state.limit=40;renderPeople()});document.getElementById('load-more').addEventListener('click',()=>{state.limit+=40;renderPeople()});document.getElementById('nav').addEventListener('click',e=>{const button=e.target.closest('button[data-view]');if(button)switchView(button.dataset.view)});document.getElementById('detail-close').addEventListener('click',closeDetail);document.getElementById('composer').addEventListener('submit',saveConversation);document.getElementById('import-file').addEventListener('change',async e=>{try{loadImportPayload(await e.target.files[0].text())}catch(error){toast('JSONを読めません：'+error.message,true)}});document.getElementById('load-import-json').addEventListener('click',()=>loadImportPayload(document.getElementById('import-json').value));document.getElementById('preview-import').addEventListener('click',previewImport);document.getElementById('route').addEventListener('change',tickTrain);renderTags();tickTrain();setInterval(tickTrain,1000);loadBootstrap();
  </script>
