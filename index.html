<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>業務支援シンプル - 人物リスト</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f2f2f2; margin: 0; padding: 10px; color: #333; }
    
    /* 電車ウィジェット */
    .train-widget { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 15px; border-radius: 12px; margin-bottom: 15px; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .train-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .train-select { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5); padding: 5px; border-radius: 15px; color: white; font-size: 12px; }
    .train-select option { color: #333; }
    .countdown-big { font-size: 32px; font-weight: bold; text-align: center; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }

    .view-content { display: block; animation: fadeIn 0.3s ease; }

    /* リスト画面・カード */
    .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer; }
    #search-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; box-sizing: border-box; font-size: 16px; }
    .person-card { display: flex; justify-content: space-between; align-items: center; position: relative; border-left: 5px solid transparent; }
    .person-card.pinned { border-left-color: #f4b400; }
    .p-name { font-weight: bold; font-size: 17px; }
    .p-detail { font-size: 13px; color: #444; margin-top: 4px; line-height: 1.4; }
    .p-sub-detail { font-size: 11px; color: #888; margin-top: 2px; }
    .p-tags { font-size: 11px; color: #007bff; margin-top: 6px; }
    .bell { color: #f4b400; font-size: 14px; margin-left: 5px; }
    .error-msg { color: #d32f2f; background: #ffebee; padding: 10px; border-radius: 8px; font-size: 14px; margin-bottom: 15px; }

    /* モーダル */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: flex-end; justify-content: center; z-index: 1000; }
    .modal-content { background: white; width: 100%; max-width: 600px; padding: 20px; border-radius: 15px 15px 0 0; max-height: 90vh; overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column; }
    
    .m-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .m-name { font-size: 20px; font-weight: bold; }
    
    /* 経歴表示エリア */
    .career-box { background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; }
    .career-title { font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    .career-item { font-size: 13px; margin-bottom: 4px; display: flex; gap: 8px; }
    .career-year { font-weight: bold; color: #007bff; width: 35px; flex-shrink: 0; }
    .career-detail { color: #333; }

    /* 追加情報・タグ・イベント */
    .info-box { background: #f9f9f9; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; font-size: 13px; }
    .info-row { display: flex; align-items: center; margin-bottom: 8px; gap: 5px; }
    .info-row:last-child { margin-bottom: 0; }
    .info-label { font-weight: bold; color: #555; width: 70px; flex-shrink: 0; }
    .info-input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .info-input.short { width: 60px; flex: none; }

    textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; resize: none; background: #fafafa; box-sizing: border-box; margin-bottom: 10px; }
    
    .tag-area { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; }
    .tag-btn { background: white; border: 1px solid #007bff; color: #007bff; padding: 5px 10px; border-radius: 15px; font-size: 12px; cursor: pointer; }
    
    .event-box { background: #f0f8ff; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #d0e0ff; }
    .event-label { font-size: 12px; font-weight: bold; color: #007bff; margin-bottom: 5px; }
    .input-row { display: flex; gap: 10px; }
    .input-date { flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; }
    .input-text { flex: 2; padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; }

    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button.action-btn { padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; flex: 1; }
    .btn-save { background: #333; color: white; }
    .btn-close { background: #eee; color: #555; }
    
    #loading { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); align-items:center; justify-content:center; font-weight:bold; color:#333; z-index:2000; }
  </style>
</head>
<body>

  <div class="train-widget">
    <div class="train-header">
      <span>🚃 次の電車 (平日ダイヤ)</span>
      <select id="route-select" class="train-select" onchange="changeRoute()">
        <option value="toWork">行き：山西 → 衣山方面</option>
        <option value="toHome">帰り：衣山 → 山西方面</option>
      </select>
    </div>
    <div id="countdown-text" class="countdown-big">--:--</div>
  </div>

  <div id="view-list" class="view-content active">
    <input type="text" id="search-box" placeholder="名前・ひらがな・タグで検索 (例: や)..." onkeyup="filterList()">
    <div id="person-list">データの読み込み中...</div>
  </div>

  <div id="p-modal" class="modal" onclick="if(event.target===this)closePerson()">
    <div class="modal-content">
      <div class="m-header">
        <div class="m-name" id="pm-name">名前</div>
        <div style="font-size:12px; color:#666;" id="pm-detail">詳細</div>
      </div>
      
      <div class="career-box">
        <div class="career-title">🏢 部署・役職の履歴</div>
        <div id="pm-career-history"></div>
      </div>

      <div class="info-box">
        <div class="info-row">
          <span class="info-label">前部署:</span>
          <input type="text" id="pm-prev-section" class="info-input" placeholder="例: R6 総務課">
        </div>
        <div class="info-row">
          <span class="info-label">年齢:</span>
          <input type="text" id="pm-age" class="info-input short" placeholder="例: 35"> 歳
          <span class="info-label" style="margin-left: 10px; width: auto;">子供:</span>
          <input type="text" id="pm-child-age" class="info-input short" placeholder="例: 5歳, 中2">
        </div>
      </div>

      <textarea id="pm-memo" placeholder="新しいメモを入力..."></textarea>
      
      <div class="tag-area">
        <button class="tag-btn" onclick="addTag('ゴルフ')">ゴルフ</button>
        <button class="tag-btn" onclick="addTag('車')">🚙 車</button>
        <button class="tag-btn" onclick="addTag('マラソン')">🏃 マラソン</button>
        <button class="tag-btn" onclick="addTag('同期')">🤝 同期</button>
        <button class="tag-btn" onclick="addTag('特に仲良し')">✨ 特に仲良し</button>
        <button class="tag-btn" onclick="addTag('LINEメンバー')">💬 LINEメンバー</button>
        <button class="tag-btn" onclick="addTag('雇用保険')">🏢 雇用保険</button>
        <button class="tag-btn" onclick="addTag('給付経験あり')">💰 給付経験あり</button>
        <button class="tag-btn" onclick="addTag('結婚済み')">💍 結婚済み</button>
        <button class="tag-btn" onclick="addTag('子供いる')">👶 子供いる</button>
        <button class="tag-btn" onclick="addTag('子供いない')">👤 子供いない</button>
        <button class="tag-btn" onclick="addTag('ギャンブル')">🎰 ギャンブル</button>
        <button class="tag-btn" onclick="addTag('酒飲めない')">🈲 酒飲めない</button>
      </div>

      <div class="event-box">
        <div class="event-label">📅 誕生日・イベント設定</div>
        <div class="input-row">
          <input type="date" id="pm-date" class="input-date">
          <input type="text" id="pm-event" class="input-text" placeholder="例: 誕生日">
        </div>
      </div>

      <div class="btn-group">
        <button class="action-btn btn-close" onclick="closePerson()">閉じる</button>
        <button class="action-btn btn-save" onclick="savePerson()">保存</button>
      </div>
    </div>
  </div>
  
  <div id="loading">処理中...</div>

  <script>
    // ★★★★ 必ず先ほど新しく発行したデプロイURLに書き換えてください ★★★★
    const API_URL = "https://script.google.com/macros/s/AKfycbxQ3AS0Z5pe0WwUHqVhDF7ZFrE_f8CFANHlVWVo6QXFVtDiuQiGs0dJn2-zRJ2oimSTHg/exec";

    const SCHEDULE = {
      toWork: { 6: [23, 55], 7: [18, 44], 8: [7, 21, 35, 48], 9: [6, 21, 36, 51], 10: [6, 21, 36, 51], 11: [6, 21, 36, 51], 12: [6, 21, 36, 51], 13: [6, 21, 36, 51], 14: [6, 21, 36, 51], 15: [6, 21, 36, 51], 16: [6, 21, 36, 51], 17: [6, 21, 36, 51], 18: [6, 21, 36, 51], 19: [6, 21, 36, 51], 20: [6, 21, 36, 51], 21: [11, 31, 51], 22: [11, 31, 51], 23: [11] },
      toHome: { 6: [47], 7: [2, 17, 30, 42, 52], 8: [6, 19, 28, 52], 9: [7, 22, 37, 52], 10: [7, 22, 37, 52], 11: [7, 22, 37, 52], 12: [7, 22, 37, 52], 13: [7, 22, 37, 52], 14: [7, 22, 37, 52], 15: [7, 22, 37, 52], 16: [7, 22, 37, 52], 17: [7, 22, 37, 52], 18: [7, 22, 37, 52], 19: [7, 22, 37, 52], 20: [7, 22, 37], 21: [7, 37], 22: [7, 37], 23: [7, 30] }
    };

    let groupedData = []; 
    let curPersonGroup = null; 

    window.onload = async () => {
      const savedRoute = localStorage.getItem("trainRoute");
      if(savedRoute) document.getElementById("route-select").value = savedRoute;

      const listBox = document.getElementById('person-list');

      try {
        const res = await fetch(API_URL);
        const textData = await res.text();

        try {
          const rawData = JSON.parse(textData);
          if (rawData.error) {
             listBox.innerHTML = `<div class="error-msg"><b>エラー:</b> ${rawData.error}</div>`;
             return;
          }
          
          const personMap = new Map();
          rawData.forEach(row => {
            if (!row.name) return; 
            if (!personMap.has(row.name)) {
              personMap.set(row.name, {
                name: row.name,
                kana: row.kana || "",
                records: [] 
              });
            }
            personMap.get(row.name).records.push(row);
          });

          // 年度(A列)の文字列で降順ソート (例: R8 -> R7)
          groupedData = Array.from(personMap.values()).map(person => {
            person.records.sort((a, b) => (b.year || "").localeCompare(a.year || ""));
            person.latest = person.records[0]; // 最新年度を代表とする
            return person;
          });

          renderList(groupedData);
          
        } catch(jsonErr) {
          console.error("データ解析エラー:", textData);
          listBox.innerHTML = `<div class="error-msg"><b>データの読み込みに失敗しました。</b></div>`;
        }
      } catch(e) { 
        console.error("通信エラー:", e);
        listBox.innerHTML = `<div class="error-msg"><b>通信エラーが発生しました。</b></div>`;
      }
    };

    /* リスト表示 */
    function renderList(list) {
      const box = document.getElementById('person-list');
      if(list.length === 0) { box.innerHTML = "データがありません。"; return; }
      
      box.innerHTML = list.map(p => {
        const latest = p.latest;
        return `<div class="card person-card ${latest.isPinned?'pinned':''}" onclick='openPerson(${JSON.stringify(p)})'>
           <div style="width: 100%;">
             <div class="p-name">${p.name} <span class="bell">${latest.eventDate ? "🔔" : ""}</span></div>
             <div class="p-detail">🏢現行(${latest.year}): ${latest.section||"-"} / ${latest.role||"-"}</div>
             <div class="p-sub-detail">🔙前部署: ${latest.prevSection || "未登録"} | 年齢: ${latest.age || "-"}</div>
             <div class="p-tags">${latest.tags||""}</div>
           </div>
         </div>`;
      }).join('');
    }

    /* 検索処理 */
    function filterList() {
      const v = document.getElementById('search-box').value.toLowerCase();
      renderList(groupedData.filter(p => {
        const targetString = ((p.name) + (p.kana) + (p.latest.tags || "")).toLowerCase();
        return targetString.includes(v);
      }));
    }

    /* 詳細モーダル表示 */
    function openPerson(personGroup) {
      curPersonGroup = personGroup;
      const latest = personGroup.latest; 

      document.getElementById('pm-name').innerText = personGroup.name;
      document.getElementById('pm-detail').innerText = `🏢現行(${latest.year}): ${latest.section||"-"} / ${latest.role||"-"}`;
      
      // 経歴エリアの生成
      const historyHtml = personGroup.records.map(r => 
        `<div class="career-item">
           <div class="career-year">${r.year||"-"}</div>
           <div class="career-detail">${r.section||"-"} / ${r.role||"-"}</div>
         </div>`
      ).join('');
      document.getElementById('pm-career-history').innerHTML = historyHtml;

      document.getElementById('pm-prev-section').value = latest.prevSection || "";
      document.getElementById('pm-age').value = latest.age || "";
      document.getElementById('pm-child-age').value = latest.childAge || "";
      document.getElementById('pm-memo').value = latest.memo || "";
      
      let eDate = latest.eventDate || "";
      if(eDate && eDate.includes("T")) eDate = eDate.split("T")[0];
      document.getElementById('pm-date').value = eDate;
      document.getElementById('pm-event').value = latest.eventName || "";

      document.getElementById('p-modal').style.display = 'flex';
    }

    function closePerson() { document.getElementById('p-modal').style.display = 'none'; }
    function addTag(t) { document.getElementById('pm-memo').value += " #" + t; }

    /* データ保存 */
    async function savePerson() {
      showLoad(true);
      const latest = curPersonGroup.latest; 
      
      const memo = document.getElementById('pm-memo').value;
      const eDate = document.getElementById('pm-date').value;
      const eName = document.getElementById('pm-event').value;
      const prevSec = document.getElementById('pm-prev-section').value;
      const pAge = document.getElementById('pm-age').value;
      const pChildAge = document.getElementById('pm-child-age').value;
      
      let tags = "";
      if (memo.includes("#")) {
        const matches = memo.match(/#[^\s]+/g);
        if(matches) tags = matches.join(" ");
      } else {
        tags = latest.tags || ""; 
      }

      try {
        const res = await fetch(API_URL, { 
          method:"POST", 
          body:JSON.stringify({
            action: "save", 
            name: latest.name, 
            year: latest.year, 
            memo: memo,
            eventDate: eDate,
            eventName: eName,
            tags: tags,
            prevSection: prevSec,
            age: pAge,
            childAge: pChildAge
          }) 
        });
        const result = await res.json();
        
        if(result.status === "success") {
          alert("保存しました");
          location.reload();
        } else {
          alert("保存エラー: " + (result.error || "不明なエラー"));
          showLoad(false);
        }
      } catch(e) {
        alert("通信に失敗しました。");
        showLoad(false);
      }
    }

    function changeRoute() { localStorage.setItem("trainRoute", document.getElementById("route-select").value); }
    function showLoad(b) { document.getElementById('loading').style.display = b ? 'flex' : 'none'; }
    
    setInterval(() => {
      const route = document.getElementById("route-select").value;
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      let next = null;
      const currentSchedule = SCHEDULE[route];
      
      if (currentSchedule && currentSchedule[h]) {
        for(let min of currentSchedule[h]) {
          if(m < min) { next = new Date(now); next.setMinutes(min); next.setSeconds(0); break; }
        }
      }
      
      if(!next) {
        for(let nextH = h + 1; nextH < 24; nextH++) {
           if(currentSchedule[nextH] && currentSchedule[nextH].length > 0) {
             next = new Date(now); next.setHours(nextH); next.setMinutes(currentSchedule[nextH][0]); next.setSeconds(0); break;
           }
        }
      }

      if(!next) { document.getElementById('countdown-text').innerText = "運行終了"; return; }
      const diff = Math.floor((next - now) / 1000);
      document.getElementById('countdown-text').innerText = `${Math.floor(diff/60)}分${('0'+diff%60).slice(-2)}秒`;
    }, 1000);
  </script>
</body>
</html>
