<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>人物ネタ帳</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #172033;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 480px);
      padding: 32px 28px;
      border: 1px solid #e1e6ee;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 20px 50px rgba(30, 48, 80, 0.08);
    }
    .mark {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      border-radius: 16px;
      background: #eaf2ff;
      font-size: 26px;
    }
    h1 { margin: 0 0 12px; font-size: 26px; }
    p { margin: 0; color: #5b667a; line-height: 1.8; }
    small {
      display: block;
      margin-top: 24px;
      color: #8a94a6;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🗒️</div>
    <h1>人物ネタ帳</h1>
    <p>安全な新しいアプリへ移行しています。現在、この公開ページから人物情報へはアクセスできません。</p>
    <small>関係者専用</small>
  </main>
</body>
</html>
