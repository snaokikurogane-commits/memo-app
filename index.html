<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>業務支援 ＆ 内示検索システム</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #eef2f5; margin: 0; padding: 10px; color: #333; }
    
    .train-widget { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 15px; border-radius: 12px; margin-bottom: 15px; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .train-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .train-select { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5); padding: 5px; border-radius: 15px; color: white; font-size: 12px; }
    .train-select option { color: #333; }
    .countdown-big { font-size: 32px; font-weight: bold; text-align: center; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }

    .main-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .main-tab-btn { flex: 1; padding: 10px; background: white; border-radius: 8px; text-align: center; font-weight: bold; font-size: 13px; color: #666; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .main-tab-btn.active { background: #333; color: white; }
    
    .view-content { display: none; }
    .view-content.active { display: block; animation: fadeIn 0.3s ease; }

    .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .clickable { cursor: pointer; }
    
    .search-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; box-sizing: border-box; font-size: 16px; transition: border-color 0.3s; }
    .search-box:focus { border-color: #007bff; outline: none; }

    .person-card { display: flex; justify-content: space-between; align-items: center; position: relative; border-left: 5px solid transparent; }
    .person-card.pinned { border-left-color: #f4b400; }
    .p-name { font-weight: bold; font-size: 17px; }
    .p-detail { font-size: 13px; color: #444; margin-top: 4px; line-height: 1.4; }
    .p-sub-detail { font-size: 11px; color: #888; margin-top: 2px; }
    .p-tags { font-size: 11px; color: #007bff; margin-top: 6px; }
    .bell { color: #f4b400; font-size: 14px; margin-left: 5px; }

    .naiji-card { border-left: 5px solid #d4145a; }
    .n-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 10px; }
    .n-name { font-weight: bold; font-size: 19px; color: #111; }
    .n-badge { background: #666; color: white; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .n-badge.idou { background: #007bff; }
    .n-badge.shonin { background: #28a745; }
    .n-badge.taishoku { background: #dc3545; }
    .n-detail-row { display: flex; font-size: 14px; margin-bottom: 5px; line-height: 1.4; }
    .n-label { color: #888; width: 45px; flex-shrink: 0; font-size: 12px; margin-top: 2px; }
    .n-value { color: #555; }
    .n-value.new-pos { font-weight: bold; color: #d4145a; font-size: 15px; }
    .n-arrow { margin: 5px 0 5px 45px; color: #ccc; font-size: 14px; }
    .n-date { font-size: 11px; color: #aaa; text-align: right; margin-top: 5px; }

    .timer-add-btn { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 15px; cursor: pointer; }
    .timer-date { font-size: 12px; color: #999; }
    .timer-diff { font-size: 20px; font-weight: bold; color: #333; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: flex-end; justify-content: center; z-index: 1000; }
    .modal-content { background: white; width: 100%; max-width: 600px; padding: 20px; border-radius: 15px 15px 0 0; max-height: 90vh; overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column; }
    
    .edit-header-box { background: #f0f7ff; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px dashed #007bff; box-sizing: border-box; width: 100%; flex-shrink: 0; }
    .edit-header-label { font-size: 11px; font-weight: bold; color: #007bff; margin-bottom: 8px; display: block; }
    .m-name-input { font-size: 18px; font-weight: bold; width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 8px; min-width: 0; }
    .m-org-input-row { display: flex; gap: 8px; width: 100%; box-sizing: border-box; }
    .m-org-input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; min-width: 0; }

    .info-box { background: #f9f9f9; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; font-size: 13px; box-sizing: border-box; width: 100%; flex-shrink: 0; }
    .info-row { display: flex; align-items: center; margin-bottom: 8px; gap: 5px; width: 100%; box-sizing: border-box; }
    .info-row:last-child { margin-bottom: 0; }
    .info-label { font-weight: bold; color: #555; width: 60px; flex-shrink: 0; }
    
    /* 入力フォームの調整 */
    .info-input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; min-width: 0; }
    .info-input.short { width: 50px; flex: none; text-align: center; }
    .history-select { padding: 5px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; background: white; }

    textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; resize: none; background: #fafafa; box-sizing: border-box; margin-bottom: 10px; flex-shrink: 0; }
    
    .tag-area { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 15px; flex-shrink: 0; }
    .tag-btn { background: white; border: 1px solid #007bff; color: #007bff; padding: 4px 8px; border-radius: 12px; font-size: 11px; cursor: pointer; white-space: nowrap; }
    
    .event-box { background: #f0f8ff; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #d0e0ff; flex-shrink: 0; box-sizing: border-box; width: 100%; }
    .event-label { font-size: 12px; font-weight: bold; color: #007bff; margin-bottom: 5px; }
    .input-row { display: flex; gap: 10px; }
    .input-date { flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; min-width: 0; }
    .input-text { flex: 2; padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; min-width: 0; }

    .history-title { font-size: 12px; font-weight: bold; color: #555; margin-top: 5px; margin-bottom: 5px; flex-shrink: 0; }
    .history-box { background: #f9f9f9; padding: 10px; border-radius: 8px; border: 1px solid #eee; min-height: 250px; overflow-y: visible; margin-bottom: 15px; flex-shrink: 0; box-sizing: border-box; width: 100%; }
    .h-item { border-bottom: 1px solid #eee; padding: 8px 0; font-size: 13px; line-height: 1.4; }
    .h-date { color: #00b900; font-weight: bold; font-size: 11px; margin-bottom: 2px; }

    .btn-group { display: flex; gap: 10px; margin-top: 5px; flex-shrink: 0; }
    button.action-btn { padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; flex: 1; }
    .btn-save { background: #333; color: white; }
    .btn-close { background: #eee; color: #555; }
    
    #loading { display:flex; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); align-items:center; justify-content:center; font-weight:bold; color:#333; z-index:2000; flex-direction:column; transition: opacity 0.3s; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #333; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin-bottom: 10px; }
    #loading-text { font-size: 16px; color: #333; transition: color 0.3s, font-size 0.3s; }
    
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner" id="loading-spinner"></div>
    <div id="loading-text">データを読み込み中...</div>
  </div>

  <div class="train-widget">
    <div class="train-header">
      <span>🚃 次の電車 (平日ダイヤ)</span>
      <select id="route-select" class="train-select" onchange="changeRoute()">
        <option value="toWork">行き：山西 → 衣山方面</option>
        <option value="toHome">帰り：衣山 → 山西方面</option>
      </select>
    </div>
    <div id="countdown-text" class="countdown-big">--:--</div>
  </div>

  <div class="main-tabs">
    <div id="tab-list" class="main-tab-btn active" onclick="switchMainTab('list')">👥 人物リスト</div>
    <div id="tab-naiji" class="main-tab-btn" onclick="switchMainTab('naiji')">🌸 内示検索</div>
    <div id="tab-timer" class="main-tab-btn" onclick="switchMainTab('timer')">⏳ 経過管理</div>
  </div>

  <div id="view-list" class="view-content active">
    <input type="text" id="search-box-list" class="search-box" placeholder="名前・ひらがな・タグで検索..." onkeyup="filterList()">
    <div id="person-list"></div>
  </div>

  <div id="view-naiji" class="view-content">
    <input type="text" id="search-box-naiji" class="search-box" style="border-color: #d4145a;" placeholder="名前やひらがなで内示を検索..." onkeyup="filterNaiji()">
    <div id="naiji-list"></div>
  </div>

  <div id="view-timer" class="view-content">
    <button class="timer-add-btn" onclick="openTimerModal()">＋ 記録追加</button>
    <div id="timer-list"></div>
  </div>

  <div id="p-modal" class="modal" onclick="if(event.target===this)closePerson()">
    <div class="modal-content">
      
      <div class="edit-header-box">
        <span class="edit-header-label">✏️ マスタ情報 (直接修正できます)</span>
        <input type="text" id="pm-edit-name" class="m-name-input" placeholder="名前">
        <div class="m-org-input-row">
          <input type="text" id="pm-edit-section" class="m-org-input" placeholder="現所属">
          <input type="text" id="pm-edit-role" class="m-org-input" placeholder="現役職">
        </div>
      </div>
      
      <div class="info-box">
        <div class="info-row">
          <span class="info-label">部署履歴:</span>
          <select id="pm-history-year" class="history-select" onchange="changeHistoryYear()">
            <option value="令和6年度">R6</option>
            <option value="令和5年度">R5</option>
            <option value="令和4年度">R4</option>
            <option value="令和3年度">R3</option>
            <option value="令和2年度">R2</option>
            <option value="令和元年度">R1</option>
          </select>
          <input type="text" id="pm-prev-section" class="info-input" placeholder="この年度の部署を入力" onkeyup="updateHistorySection()">
        </div>
        <div class="info-row">
          <span class="info-label">年齢:</span>
          <input type="text" id="pm-age" class="info-input short" placeholder="例: 35"> 歳
          <span class="info-label" style="margin-left: 10px; width: auto;">子供:</span>
          <input type="text" id="pm-child-age" class="info-input" placeholder="例: 5歳, 中2">
        </div>
      </div>

      <textarea id="pm-memo" placeholder="新しいメモを入力..."></textarea>
      
      <div class="tag-area">
        <button class="tag-btn" onclick="addTag('ゴルフ')">ゴルフ</button>
        <button class="tag-btn" onclick="addTag('車')">🚙 車</button>
        <button class="tag-btn" onclick="addTag('マラソン')">🏃 マラソン</button>
        <button class="tag-btn" onclick="addTag('同期')">🤝 同期</button>
        <button class="tag-btn" onclick="addTag('特に仲良し')">✨ 特に仲良し</button>
        <button class="tag-btn" onclick="addTag('LINEメンバー')">💬 LINEメンバー</button>
        <button class="tag-btn" onclick="addTag('雇用保険')">🏢 雇用保険</button>
        <button class="tag-btn" onclick="addTag('給付経験あり')">💰 給付経験あり</button>
        <button class="tag-btn" onclick="addTag('結婚済み')">💍 結婚済み</button>
        <button class="tag-btn" onclick="addTag('子供いる')">👶 子供いる</button>
        <button class="tag-btn" onclick="addTag('子供いない')">👤 子供いない</button>
        <button class="tag-btn" onclick="addTag('ギャンブル')">🎰 ギャンブル</button>
        <button class="tag-btn" onclick="addTag('酒飲めない')">🈲 酒飲めない</button>
      </div>

      <div class="event-box">
        <div class="event-label">📅 誕生日・イベント設定</div>
        <div class="input-row">
          <input type="date" id="pm-date" class="input-date">
          <input type="text" id="pm-event" class="input-text" placeholder="例: 誕生日">
        </div>
      </div>

      <div class="history-title">▼ 過去のメモ履歴</div>
      <div id="pm-history" class="history-box"></div>

      <div class="btn-group">
        <button class="action-btn btn-close" onclick="closePerson()">閉じる</button>
        <button class="action-btn btn-save" onclick="savePerson()">保存</button>
      </div>
    </div>
  </div>
  
  <div id="t-modal" class="modal" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-content" style="height: auto;">
      <h3>記録追加</h3>
      <input type="text" id="tm-name" class="input-text" placeholder="項目名(美容院など)" style="width:100%; margin-bottom:10px; box-sizing: border-box;">
      <input type="date" id="tm-date" class="input-date" style="width:100%; margin-bottom:10px; box-sizing: border-box;">
      <textarea id="tm-memo" placeholder="メモ" style="height:60px; margin-bottom: 10px;"></textarea>
      <div class="btn-group">
        <button class="action-btn btn-close" onclick="document.getElementById('t-modal').style.display='none'">閉じる</button>
        <button class="action-btn btn-save" onclick="saveTimer()">保存</button>
      </div>
    </div>
  </div>

  <script>
    // ★現在のGASのURLに変更してください
    const API_URL = "https://script.google.com/macros/s/AKfycbzUtS5ZzNRwgQzzE7IYiE7Bcy3eB9u5TcJaBcPy8QPo0nOynj0wx6eZvtv1UHU3DtwmPw/exec";

    const SCHEDULE = {
      toWork: { 6: [23, 55], 7: [18, 44], 8: [7, 21, 35, 48], 9: [6, 21, 36, 51], 10: [6, 21, 36, 51], 11: [6, 21, 36, 51], 12: [6, 21, 36, 51], 13: [6, 21, 36, 51], 14: [6, 21, 36, 51], 15: [6, 21, 36, 51], 16: [6, 21, 36, 51], 17: [6, 21, 36, 51], 18: [6, 21, 36, 51], 19: [6, 21, 36, 51], 20: [6, 21, 36, 51], 21: [11, 31, 51], 22: [11, 31, 51], 23: [11] },
      toHome: { 6: [47], 7: [2, 17, 30, 42, 52], 8: [6, 19, 28, 52], 9: [7, 22, 37, 52], 10: [7, 22, 37, 52], 11: [7, 22, 37, 52], 12: [7, 22, 37, 52], 13: [7, 22, 37, 52], 14: [7, 22, 37, 52], 15: [7, 22, 37, 52], 16: [7, 22, 37, 52], 17: [7, 22, 37, 52], 18: [7, 22, 37, 52], 19: [7, 22, 37, 52], 20: [7, 22, 37], 21: [7, 37], 22: [7, 37], 23: [7, 30] }
    };

    let allData = [];
    let naijiData = [];
    let curPerson = null;
    let currentDeptHistory = {}; // ★部署履歴を裏側で記憶しておく箱

    // 年齢自動計算 (1/1起算)
    function calcAge(rawStr) {
      if (!rawStr) return "";
      const parts = String(rawStr).split('@@');
      let text = parts[0];
      if (parts.length > 1) {
        const baseYear = parseInt(parts[1]);
        const currentYear = new Date().getFullYear(); 
        const diff = currentYear - baseYear;
        if (diff > 0) {
          text = text.replace(/\d+/g, (match) => parseInt(match) + diff);
        }
      }
      return text;
    }

    // ★リスト画面で表示するための最新の「前部署」を取得する関数
    function getLatestHistory(jsonStr) {
      if (!jsonStr) return "未登録";
      try {
        const obj = JSON.parse(jsonStr);
        const years = ["令和6年度", "令和5年度", "令和4年度", "令和3年度", "令和2年度", "令和元年度"];
        for (let y of years) {
          if (obj[y]) return `${y.replace("年度","").replace("令和","R")}: ${obj[y]}`;
        }
        return "未登録";
      } catch(e) {
        return jsonStr; // 昔のそのままの文字だった場合の保険
      }
    }

    window.onload = async () => {
      const savedRoute = localStorage.getItem("trainRoute");
      if(savedRoute) document.getElementById("route-select").value = savedRoute;

      const cachedMaster = localStorage.getItem("cache_allData");
      const cachedNaiji = localStorage.getItem("cache_naijiData");
      
      if (cachedMaster) {
        allData = JSON.parse(cachedMaster);
        renderList(allData);
        document.getElementById('loading').style.display = 'none';
      }
      if (cachedNaiji) {
        naijiData = JSON.parse(cachedNaiji);
        renderNaijiList(naijiData);
      }
      loadTimer(true);

      try {
        const [resMaster, resNaiji] = await Promise.all([
          fetch(API_URL), fetch(API_URL + "?action=getNaiji")
        ]);
        allData = await resMaster.json();
        naijiData = await resNaiji.json();

        localStorage.setItem("cache_allData", JSON.stringify(allData));
        localStorage.setItem("cache_naijiData", JSON.stringify(naijiData));
        
        renderList(allData);
        renderNaijiList(naijiData);
        document.getElementById('loading').style.display = 'none';
      } catch(e) { 
        document.getElementById('loading-text').innerText = "通信エラー: キャッシュを表示します";
        setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 1500);
      }
      loadTimer(false);
    };

    function switchMainTab(id) {
      document.querySelectorAll('.view-content').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.main-tab-btn').forEach(e => e.classList.remove('active'));
      document.getElementById('view-' + id).classList.add('active');
      document.getElementById('tab-' + id).classList.add('active');
    }

    function renderList(list) {
      const box = document.getElementById('person-list');
      if(list.length === 0) { box.innerHTML = "データなし"; return; }
      box.innerHTML = list.map(p => 
        `<div class="card person-card clickable ${p.isPinned?'pinned':''}" onclick='openPerson(${JSON.stringify(p)})'>
           <div style="width: 100%;">
             <div class="p-name">${p.name} <span class="bell">${p.eventDate ? "🔔" : ""}</span></div>
             <div class="p-detail">🏢現行(${p.year}): ${p.section||"-"} / ${p.role||"-"}</div>
             <div class="p-sub-detail">🔙前部署: ${getLatestHistory(p.prevSection)} | 年齢: ${calcAge(p.age) || "-"} | 子: ${calcAge(p.childAge) || "-"}</div>
             <div class="p-tags">${p.tags||""}</div>
           </div>
         </div>`
      ).join('');
    }

    function filterList() {
      const v = document.getElementById('search-box-list').value.toLowerCase().replace(/[\s　]+/g, '');
      renderList(allData.filter(p => {
        const targetString = (p.name + (p.kana || "") + (p.tags || "")).toLowerCase().replace(/[\s　]+/g, '');
        return targetString.includes(v);
      }));
    }

    // ★モーダルを開いたときの処理
    async function openPerson(p) {
      curPerson = p;
      
      document.getElementById('pm-edit-name').value = p.name;
      document.getElementById('pm-edit-section').value = p.section || "";
      document.getElementById('pm-edit-role').value = p.role || "";
      
      // 部署履歴の復元
      try {
        currentDeptHistory = JSON.parse(p.prevSection || "{}");
      } catch(e) {
        currentDeptHistory = {"令和6年度": p.prevSection || ""};
      }
      document.getElementById('pm-history-year').value = "令和6年度"; // 初期表示はR6
      document.getElementById('pm-prev-section').value = currentDeptHistory["令和6年度"] || "";
      
      document.getElementById('pm-age').value = calcAge(p.age);
      document.getElementById('pm-child-age').value = calcAge(p.childAge);
      
      document.getElementById('pm-memo').value = "";
      document.getElementById('pm-date').value = p.eventDate || "";
      document.getElementById('pm-event').value = p.eventName || "";

      document.getElementById('p-modal').style.display = 'flex';
      
      const histBox = document.getElementById('pm-history');
      histBox.innerHTML = "読み込み中...";
      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getHistory", name: p.name }) });
        const history = await res.json();
        if(history.length === 0) {
          histBox.innerHTML = "<div style='color:#999; font-size:12px;'>履歴なし</div>";
        } else {
          histBox.innerHTML = history.map(h => 
            `<div class="h-item"><div class="h-date">${h.date}</div><div>${h.memo}</div></div>`
          ).join('');
        }
      } catch(e) { histBox.innerHTML = "エラーが発生しました"; }
    }

    // ★年度ドロップダウンを変更したときの処理
    function changeHistoryYear() {
      const selectedYear = document.getElementById('pm-history-year').value;
      document.getElementById('pm-prev-section').value = currentDeptHistory[selectedYear] || "";
    }

    // ★入力欄で文字を打ったときの処理
    function updateHistorySection() {
      const selectedYear = document.getElementById('pm-history-year').value;
      currentDeptHistory[selectedYear] = document.getElementById('pm-prev-section').value;
    }

    function closePerson() { document.getElementById('p-modal').style.display = 'none'; }
    function addTag(t) { document.getElementById('pm-memo').value += " #" + t; }

    function showSuccessAndReload() {
      const spinner = document.getElementById('loading-spinner');
      const text = document.getElementById('loading-text');
      spinner.style.display = 'none'; 
      text.innerText = "✅ 保存しました！";
      text.style.color = "#28a745"; 
      text.style.fontSize = "20px";
      text.style.fontWeight = "bold";
      setTimeout(() => { location.reload(); }, 800);
    }

    async function savePerson() {
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('loading-spinner').style.display = 'block';
      document.getElementById('loading-text').innerText = "保存中...";
      document.getElementById('loading-text').style.color = "#333";
      document.getElementById('loading-text').style.fontSize = "16px";
      
      const memo = document.getElementById('pm-memo').value;
      const eDate = document.getElementById('pm-date').value;
      const eName = document.getElementById('pm-event').value;
      
      // ★履歴データをJSON文字列に変換して送信準備
      const prevSecJSON = JSON.stringify(currentDeptHistory);
      
      const currentYear = new Date().getFullYear();
      let pAge = document.getElementById('pm-age').value.trim();
      if (pAge && !pAge.includes('@@')) pAge += "@@" + currentYear;
      
      let pChildAge = document.getElementById('pm-child-age').value.trim();
      if (pChildAge && !pChildAge.includes('@@')) pChildAge += "@@" + currentYear;
      
      const editName = document.getElementById('pm-edit-name').value;
      const editSection = document.getElementById('pm-edit-section').value;
      const editRole = document.getElementById('pm-edit-role').value;
      
      let tags = "";
      if (memo.includes("#")) { tags = memo.match(/#[^\s]+/g).join(" "); } else { tags = curPerson.tags || ""; }

      await fetch(API_URL, { 
        method:"POST", 
        body:JSON.stringify({
          action: "save", year: curPerson.year, originalName: curPerson.name, 
          name: editName, section: editSection, role: editRole, 
          memo: memo, eventDate: eDate, eventName: eName, tags: tags, 
          prevSection: prevSecJSON, // ★JSONとして送信
          age: pAge, childAge: pChildAge
        }) 
      });
      
      localStorage.removeItem("cache_allData");
      showSuccessAndReload();
    }

    function getNBadgeClass(category) {
      if (!category) return 'n-badge';
      if (category.includes('昇任')) return 'n-badge shonin';
      if (category.includes('退職')) return 'n-badge taishoku';
      if (category.includes('異動')) return 'n-badge idou';
      return 'n-badge';
    }

    function renderNaijiList(list) {
      const box = document.getElementById('naiji-list');
      if(list.length === 0) { box.innerHTML = "<div style='text-align:center; color:#999; margin-top:20px;'>見つかりませんでした</div>"; return; }
      box.innerHTML = list.map(p => 
        `<div class="card naiji-card">
           <div class="n-header">
             <div class="n-name">${p.name}</div>
             ${p.category ? `<div class="${getNBadgeClass(p.category)}">${p.category}</div>` : ""}
           </div>
           <div class="n-detail-row"><span class="n-label">現職:</span><span class="n-value">${p.currentSection}</span></div>
           <div class="n-arrow">⬇️</div>
           <div class="n-detail-row"><span class="n-label">新職:</span><span class="n-value new-pos">${p.newSection}</span></div>
           <div class="n-date">内示日: ${p.date || "-"}</div>
         </div>`
      ).join('');
    }

    function filterNaiji() {
      const v = document.getElementById('search-box-naiji').value.toLowerCase().replace(/[\s　]+/g, '');
      renderNaijiList(naijiData.filter(p => {
        const targetString = (p.name + (p.kana || "") + p.currentSection + p.newSection).toLowerCase().replace(/[\s　]+/g, '');
        return targetString.includes(v);
      }));
    }

    async function loadTimer(isCache = false) {
      if (isCache) {
        const cachedTimer = localStorage.getItem("cache_timerData");
        if (cachedTimer) renderTimer(JSON.parse(cachedTimer));
        return;
      }
      try {
        const res = await fetch(API_URL + "?action=getTimer");
        const data = await res.json();
        localStorage.setItem("cache_timerData", JSON.stringify(data));
        renderTimer(data);
      } catch(e) { console.log(e); }
    }

    function renderTimer(data) {
      const grouped = {};
      data.forEach(t => { if(!grouped[t.name]) grouped[t.name]=t; });
      document.getElementById('timer-list').innerHTML = Object.values(grouped).map(t => {
        const diff = Math.floor((new Date() - new Date(t.date))/(86400000));
        return `<div class="card">
                  <div>${t.name}</div>
                  <div class="timer-date">最終: ${t.date}</div>
                  <div class="timer-diff">${diff}日前</div>
                  <div style="font-size:12px; color:#666;">${t.memo||""}</div>
                </div>`;
      }).join('');
    }

    function openTimerModal() { document.getElementById('t-modal').style.display = 'flex'; }
    async function saveTimer() {
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('loading-spinner').style.display = 'block';
      document.getElementById('loading-text').innerText = "保存中...";
      document.getElementById('loading-text').style.color = "#333";
      document.getElementById('loading-text').style.fontSize = "16px";

      const name = document.getElementById('tm-name').value;
      const date = document.getElementById('tm-date').value;
      const memo = document.getElementById('tm-memo').value;
      await fetch(API_URL, { method:"POST", body:JSON.stringify({action:"saveTimer", eventName:name, date:date, memo:memo}) });
      localStorage.removeItem("cache_timerData");
      showSuccessAndReload();
    }

    function changeRoute() { localStorage.setItem("trainRoute", document.getElementById("route-select").value); }
    
    setInterval(() => {
      const route = document.getElementById("route-select").value;
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      let next = null;
      const currentSchedule = SCHEDULE[route];
      
      if (currentSchedule && currentSchedule[h]) {
        for(let min of currentSchedule[h]) {
          if(m < min) { next = new Date(now); next.setMinutes(min); next.setSeconds(0); break; }
        }
      }
      if(!next) {
        for(let nextH = h + 1; nextH < 24; nextH++) {
           if(currentSchedule[nextH] && currentSchedule[nextH].length > 0) {
             next = new Date(now); next.setHours(nextH); next.setMinutes(currentSchedule[nextH][0]); next.setSeconds(0); break;
           }
        }
      }
      if(!next) { document.getElementById('countdown-text').innerText = "運行終了"; return; }
      const diff = Math.floor((next - now) / 1000);
      document.getElementById('countdown-text').innerText = `${Math.floor(diff/60)}分${('0'+diff%60).slice(-2)}秒`;
    }, 1000);
  </script>
